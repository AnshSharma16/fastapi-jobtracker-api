version: "3.9"

services:
  postgres:
    image: postgres:16

    container_name: jobtracker-postgres

    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: jobtracker_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: